name: Alertes emploi

on:
  schedule:
    - cron: "*/15 * * * *"   # toutes les 15 minutes (GitHub peut retarder de quelques minutes)
  workflow_dispatch:          # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write             # pour enregistrer seen.json

concurrency:
  group: alertes-emploi
  cancel-in-progress: false

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Chercher les nouvelles offres
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python3 job_alerts.py

      - name: Enregistrer les offres déjà vues
        run: |
          if [ -n "$(git status --porcelain seen.json)" ]; then
            git config user.name "alertes-emploi"
            git config user.email "alertes-emploi@users.noreply.github.com"
            git add seen.json
            git commit -m "Mise à jour des offres vues"
            git push
          fi
